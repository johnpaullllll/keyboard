<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mac Style Virtual Keyboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <textarea id="output" placeholder="Start typing..." readonly></textarea>
    <div class="keyboard" id="keyboard">
    
    <div class="row">
      <div class="key small">esc</div>
      <div class="key small">F1</div>
      <div class="key small">F2</div>
      <div class="key small">F3</div>
      <div class="key small">F4</div>
      <div class="key small">F5</div>
      <div class="key small">F6</div>
      <div class="key small">F7</div>
      <div class="key small">F8</div>
      <div class="key small">F9</div>
      <div class="key small">F10</div>
      <div class="key small">F11</div>
      <div class="key small">F12</div>
    </div>

    
    <div class="row">
      <div class="key">~</div>
      <div class="key">1</div>
      <div class="key">2</div>
      <div class="key">3</div>
      <div class="key">4</div>
      <div class="key">5</div>
      <div class="key">6</div>
      <div class="key">7</div>
      <div class="key">8</div>
      <div class="key">9</div>
      <div class="key">0</div>
      <div class="key">-</div>
      <div class="key">=</div>
      <div class="key wide">delete</div>
    </div>

    
    <div class="row">
      <div class="key wide">tab</div>
      <div class="key">Q</div>
      <div class="key">W</div>
      <div class="key">E</div>
      <div class="key">R</div>
      <div class="key">T</div>
      <div class="key">Y</div>
      <div class="key">U</div>
      <div class="key">I</div>
      <div class="key">O</div>
      <div class="key">P</div>
      <div class="key">[</div>
      <div class="key">]</div>
      <div class="key">\</div>
    </div>

    
    <div class="row">
      <div class="key wide">caps</div>
      <div class="key">A</div>
      <div class="key">S</div>
      <div class="key">D</div>
      <div class="key">F</div>
      <div class="key">G</div>
      <div class="key">H</div>
      <div class="key">J</div>
      <div class="key">K</div>
      <div class="key">L</div>
      <div class="key">;</div>
      <div class="key">'</div>
      <div class="key wide">return</div>
    </div>

 
    <div class="row">
      <div class="key xwide">shift</div>
      <div class="key">Z</div>
      <div class="key">X</div>
      <div class="key">C</div>
      <div class="key">V</div>
      <div class="key">B</div>
      <div class="key">N</div>
      <div class="key">M</div>
      <div class="key">,</div>
      <div class="key">.</div>
      <div class="key">/</div>
      <div class="key xwide">shift</div>
    </div>

    
    <div class="row">
      <div class="key small">fn</div>
      <div class="key small">control</div>
      <div class="key small">option</div>
      <div class="key small">command</div>
      <div class="key space">space</div>
      <div class="key small">command</div>
      <div class="key small">option</div>
      <div class="key small">←</div>
      <div class="key small">↑</div>
      <div class="key small">↓</div>
      <div class="key small">→</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
